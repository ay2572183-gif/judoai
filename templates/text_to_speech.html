<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Text to speech | Vocalis</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet"><style>body{font-family:'DM Sans',sans-serif;background:#f5f2eb;color:#20231f}.serif{font-family:Fraunces,serif}</style></head><body><div class="min-h-screen lg:grid lg:grid-cols-[250px_1fr]"><aside class="flex flex-col border-r border-[#ded8ce] bg-[#ebe7de] p-6 lg:min-h-screen"><a href="/" class="flex items-center gap-3 text-lg font-bold"><span class="grid h-9 w-9 place-items-center rounded-full bg-[#20231f] text-sm text-white">V</span> vocalis</a><nav class="mt-16 space-y-2"><a href="/dashboard" class="block rounded-xl px-4 py-3 text-sm text-[#62665e] hover:bg-white">New dubbing <span class="float-right">+</span></a><a href="/projects" class="block rounded-xl px-4 py-3 text-sm text-[#62665e] hover:bg-white">Your projects <span class="float-right">↗</span></a><a href="/text-to-speech" class="block rounded-xl bg-[#20231f] px-4 py-3 text-sm font-bold text-white">Text to speech <span class="float-right">↗</span></a></nav><div class="mt-auto hidden border-t border-[#d5d0c5] pt-5 lg:block"><p class="text-xs uppercase tracking-widest text-[#8a8d85]">Signed in as</p><p class="mt-2 truncate text-sm font-bold">{{ current_user.name }}</p><a href="/logout" class="mt-4 block text-sm text-[#dd6846]">Sign out</a></div></aside><main class="max-w-5xl px-6 py-10 sm:px-10 lg:px-16 lg:py-16"><p class="text-sm font-bold uppercase tracking-[.18em] text-[#dd6846]">Studio / text to speech</p><div class="mt-3 flex flex-wrap items-end justify-between gap-5"><div><h1 class="serif text-5xl tracking-tight">Give your words a voice.</h1><p class="mt-4 text-[#74786f]">Create natural ElevenLabs audio from any script.</p></div><a href="/dashboard" class="rounded-full border border-[#cfc8bc] px-5 py-3 text-sm font-bold">Back to dubbing</a></div><section class="mt-12 max-w-3xl rounded-3xl border border-[#d7d0c3] bg-white/60 p-6 sm:p-10"><label class="block text-sm font-bold">Your script <span class="font-normal text-[#8a8d85]">up to 5,000 characters</span></label><textarea id="speech-text" maxlength="5000" placeholder="Write something to speak..." class="mt-3 h-56 w-full resize-y rounded-2xl border border-[#d7d0c3] bg-white p-5 leading-7 outline-none focus:border-[#dd6846]"></textarea><div class="mt-6 grid gap-5 sm:grid-cols-[1fr_auto] sm:items-end"><label class="block"><span class="mb-2 block text-sm font-bold">Voice</span><select id="speech-voice" class="w-full rounded-xl border border-[#d7d0c3] bg-white px-4 py-3 outline-none focus:border-[#dd6846]"><option value="bella">Bella (Female)</option><option value="rachel">Rachel (Female)</option><option value="antoni">Antoni (Male)</option><option value="adam">Adam (Male)</option></select></label><button type="button" onclick="generateSpeech()" class="rounded-xl bg-[#dd6846] px-7 py-3 font-bold text-white hover:bg-[#bd4f31]">Generate audio →</button></div><p id="speech-message" class="mt-5 text-sm text-[#74786f]"></p><audio id="speech-player" class="mt-3 hidden w-full" controls></audio></section></main></div><script>async function generateSpeech(){const text=document.getElementById('speech-text').value.trim();const message=document.getElementById('speech-message');const player=document.getElementById('speech-player');if(!text){message.textContent='Write some text first.';return}message.textContent='Generating voice...';const response=await fetch('/text-to-speech',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text,voice_id:document.getElementById('speech-voice').value})});const data=await response.json();if(!response.ok){message.textContent=data.error||'Could not generate audio.';return}player.src=data.audio_url;player.classList.remove('hidden');player.play();message.innerHTML='<a class="font-bold text-[#dd6846]" href="'+data.audio_url+'" download>Download audio</a>';}</script></body></html>
